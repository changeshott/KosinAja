<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <title>Daftar Mitra - KosinAja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body data-mode="daftar" data-sebagai="admin" class="daftar">
<main class="w-full max-w-[1120px] grid grid-cols-[488px_1fr] bg-white rounded-[32px] p-4 shadow-[0_10px_30px_-5px_rgba(30,41,59,.06)] max-lg:grid-cols-[400px_1fr] max-md:grid-cols-1 max-md:rounded-3xl max-md:p-2">
  <section class="branding" id="branding"></section>

  <section class="pt-[26px] pr-14 pb-6 pl-18 flex flex-col max-lg:py-6 max-lg:px-8 max-md:pt-6 max-md:px-4 max-md:pb-4">
    <a href="./" class="merek text-navy max-md:hidden"><span class="merek-lambang bg-aksen text-white"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg></span>KosinAja</a>
    <div class="my-auto pt-6 pb-6 max-w-[543px] w-full max-md:pt-2">
      <h1 class="font-judul text-30 leading-[1.25] m-0 max-sm:text-24">Daftar sebagai Mitra</h1>
      <p class="text-abu text-15 mt-2 mb-6 leading-normal">Buat akun pemilik untuk mengiklankan kos dan menerima pengajuan sewa.</p>
      <form novalidate>
        <div class="grid grid-cols-2 gap-2.5 max-sm:grid-cols-1">
          <div class="field">
            <label for="nama_lengkap">Nama Lengkap</label>
            <div class="input"><input id="nama_lengkap" name="nama_lengkap" placeholder="Sesuai KTP/Identitas" autocomplete="name" required></div>
            <p class="galat-field" data-galat="nama_lengkap"></p>
          </div>
          <div class="field">
            <label for="no_telepon">Nomor WhatsApp</label>
            <div class="input"><input id="no_telepon" name="no_telepon" type="tel" inputmode="tel" placeholder="08xx-xxxx-xxxx" autocomplete="tel" required></div>
            <p class="galat-field" data-galat="no_telepon"></p>
          </div>
        </div>
        <div class="field">
          <label for="nik">NIK</label>
          <div class="input"><input id="nik" name="nik" inputmode="numeric" maxlength="16" placeholder="16 digit sesuai KTP" required></div>
          <p class="panduan">Dipakai untuk verifikasi pemilik, tidak ditampilkan ke penyewa.</p>
          <p class="galat-field" data-galat="nik"></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <div class="input"><input id="email" name="email" type="email" placeholder="nama@email.com" autocomplete="email" required></div>
          <p class="galat-field" data-galat="email"></p>
        </div>
        <div class="field">
          <label for="password">Kata Sandi</label>
          <div class="input">
            <input id="password" name="password" type="password" placeholder="Minimal 8 karakter" autocomplete="new-password" minlength="8" required>
            <button type="button" class="mata" aria-label="Tampilkan kata sandi"></button>
          </div>
          <p class="galat-field" data-galat="password"></p>
        </div>
        <div class="field">
          <label for="konfirmasi">Konfirmasi Kata Sandi</label>
          <div class="input">
            <input id="konfirmasi" name="konfirmasi" type="password" placeholder="Ulangi kata sandi" autocomplete="new-password" required>
            <button type="button" class="mata" aria-label="Tampilkan konfirmasi sandi"></button>
          </div>
          <p class="galat-field" data-galat="konfirmasi"></p>
        </div>
        <div class="field">
          <label class="setuju"><input type="checkbox" name="setuju">
            <span>Saya menyetujui <a href="#" data-segera="Halaman ketentuan sedang disiapkan.">Syarat &amp; Ketentuan</a> serta Kebijakan Privasi KosinAja.</span></label>
          <p class="galat-field" data-galat="setuju"></p>
        </div>
        <button type="submit" class="btn-utama">Daftar sebagai Mitra</button>
      </form>
    </div>

    <p class="kaki">Sudah punya akun? <a href="masuk-pemilik" data-bawa-kembali>Masuk</a>
      <span class="ganti-peran">Mencari kos? <a href="daftar">Daftar sebagai Penyewa</a></span></p>
  </section>
</main>

<script src="assets/js/inti/api.js"></script>
<script src="assets/js/halaman/auth.js"></script>
</body>
</html>
