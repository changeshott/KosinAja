<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <title>Ulasan Penghuni - KosinAja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-halaman="ulasan" data-judul="Ulasan Penghuni">
<div class="flex min-h-screen max-md:flex-col">
  <aside id="sidebar"></aside>

  <main class="konten">
    <header id="topbar"></header>

    <nav class="jejak">
      <a href="./"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Dashboard Pengelola</a>
      <span>/</span><b>Ulasan Penghuni</b>
    </nav>

    <section class="grid grid-cols-[320px_1fr] gap-6 items-start max-lg:grid-cols-1">
      <div class="rating gap-4">
        <span class="pill self-start">Skor Reputasi Kos</span>
        <div class="flex items-baseline gap-2">
          <b class="font-judul text-[56px] leading-none" id="rata">-</b><span class="opacity-85">/ 5.0</span>
        </div>
        <div class="bintang text-22 tracking-[3px]" id="bintang-rata"></div>
        <p class="m-0! text-13!" id="total-ulasan">Memuat ulasan...</p>
        <hr class="m-0!">
        <div class="flex flex-col gap-2.5 [&_.bar]:bg-white/20 [&_.bar>div]:bg-[#fbbf24]" id="sebaran"></div>
      </div>

      <div class="kartu p-0 overflow-hidden">
        <div class="flex justify-between items-center gap-4 p-6 max-sm:flex-col max-sm:items-start">
          <div>
            <h2 class="m-0 font-judul text-18">Ulasan Terbaru</h2>
            <p class="mt-1.5 mb-0 text-12 text-abu">Ditulis penyewa yang sudah menyelesaikan masa sewa di kos ini.</p>
          </div>
          <a class="btn-abu biru whitespace-nowrap" id="lihat-publik" target="_blank" rel="noopener">Lihat di Halaman Kos</a>
        </div>
        <div class="flex flex-col" id="daftar-ulasan"></div>
        <div class="flex justify-between items-center py-5 px-6 text-12 text-abu border-t border-garis max-sm:flex-col max-sm:gap-3">
          <span id="info-hasil"></span>
          <div class="paginasi" id="paginasi"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="../assets/js/inti/api.js"></script>
<script src="../assets/js/admin/layout.js"></script>
<script src="../assets/js/admin/ulasan.js"></script>
</body>
</html>
