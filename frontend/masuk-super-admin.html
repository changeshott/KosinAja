<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <title>Masuk Super Admin - KosinAja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body data-mode="masuk" data-sebagai="super_admin">
<main class="w-full max-w-[1120px] grid grid-cols-[488px_1fr] bg-white rounded-[32px] p-4 shadow-[0_10px_30px_-5px_rgba(30,41,59,.06)] max-lg:grid-cols-[400px_1fr] max-md:grid-cols-1 max-md:rounded-3xl max-md:p-2">
  <section class="branding" id="branding"></section>
  <section class="pt-[26px] pr-14 pb-6 pl-18 flex flex-col max-lg:py-6 max-lg:px-8 max-md:pt-6 max-md:px-4 max-md:pb-4">
    <a href="./" class="merek text-navy max-md:hidden"><span class="merek-lambang bg-aksen text-white">K</span>KosinAja</a>
    <div class="my-auto pt-10 pb-6 max-w-[440px] w-full max-md:pt-2">
      <h1 class="font-judul text-30 leading-[1.25] m-0 max-sm:text-24">Masuk Super Admin</h1>
      <p class="text-abu text-15 mt-2 mb-6 leading-normal">Kelola verifikasi pemilik dan akun mitra KosinAja.</p>
      <form novalidate>
        <div class="field"><label for="email">Email</label><div class="input"><input id="email" name="email" type="email" placeholder="admin@kosinaja.id" autocomplete="username" required></div><p class="galat-field" data-galat="email"></p></div>
        <div class="field"><label for="password">Kata Sandi</label><div class="input"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" class="mata" aria-label="Tampilkan kata sandi"></button></div><p class="galat-field" data-galat="password"></p></div>
        <button type="submit" class="btn-utama">Masuk</button>
      </form>
    </div>
    <p class="kaki"><a href="./">Kembali ke KosinAja</a></p>
  </section>
</main>
<script src="assets/js/inti/api.js"></script><script src="assets/js/halaman/auth.js"></script>
</body></html>
